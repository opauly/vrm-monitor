<!--
  Cap B "you've hit your scheduled-report limit" notice — PLAN_PHASE17.md
  §0.6 Q7, §8 Step 8. Sent to Oscar's OWN customer (never a third party —
  this is an account-level notice, not a report), so unlike
  report_email.html this is never branded and never carries an unsubscribe
  link; it uses this product's own identity, the same as invite_email.html
  does for account-lifecycle mail. ONE per customer per billing period —
  see vrm_api/report_delivery.py:notify_cap_reached_once()'s own docstring
  for the once-per-period gate this template's caller enforces before ever
  rendering this.

  Table layout + inline styles only, no inline base64 image URIs — same Gmail-safety rule
  invite_email.html/report_email.html already state.
-->
<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ t.cap_title }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0b2231; font-family:Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0b2231;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
                 style="width:480px; max-width:100%; background-color:#12324a; border-radius:8px; overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <span style="display:inline-block; font-family:Helvetica, Arial, sans-serif; font-weight:800;
                             text-transform:uppercase; letter-spacing:1px; font-size:13px; color:#e9f2f6;">
                  Pauly &amp; Co. &middot; VRM Monitor
                </span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 4px 32px;">
                <h1 style="margin:0 0 12px 0; font-size:18px; color:#ffffff;">{{ t.cap_title }}</h1>
                <p style="margin:0 0 12px 0; font-size:14px; line-height:1.6; color:#cfe3ee;">
                  {{ body1 }}
                </p>
                <p style="margin:0 0 20px 0; font-size:14px; line-height:1.6; color:#cfe3ee;">
                  {{ t.cap_body2 }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px 32px;">
                <p style="margin:0; font-size:12px; color:#7fa0b3;">
                  {{ t.cap_footer }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
